<!doctype html>
<html th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${timeSnapshot.label}">Server time</title>
</head>
<body>
    <main>
        <h1 th:text="${timeSnapshot.label}">Current server time</h1>
        <p><span th:text="${timeSnapshot.label}">Time</span>: <time th:text="${timeSnapshot.time}">2026-09-30T10:25:34.123</time></p>
    </main>
</body>
</html>
